name: Run DBT on Snowflake

on:
  push:
    branches: [ feature/snwflk-test ]
  workflow_dispatch:

jobs:
  dbt-run:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        model: [my_first_dbt_model, my_second_dbt_model] # Add more models as needed

    env:
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_RAW }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Create Python virtual environment and install DBT
      run: |
        python -m venv dbt-env
        source dbt-env/bin/activate
        pip install --upgrade pip
        pip install dbt-snowflake

    - name: Decode and Save Snowflake Private Key
      run: |
        echo "${SNOWFLAKE_PRIVATE_KEY_RAW}" | base64 -d > snowflake_key.p8
        chmod 600 snowflake_key.p8

    - name: Create DBT Profile
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml <<EOF
        snwflk_demo:
          target: uat
          outputs:
            uat:
              type: snowflake
              account: $SNOWFLAKE_ACCOUNT
              user: $SNOWFLAKE_USER
              private_key_path: ./snowflake_key.p8
              role: $SNOWFLAKE_ROLE
              database: $SNOWFLAKE_DATABASE
              warehouse: $SNOWFLAKE_WAREHOUSE
              schema: $SNOWFLAKE_SCHEMA
              threads: 1
        EOF

    - name: Validate secrets
      run: |
        test -n "$SNOWFLAKE_USER" || (echo "Missing SNOWFLAKE_USER" && exit 1)
        test -n "$SNOWFLAKE_ACCOUNT" || (echo "Missing SNOWFLAKE_ACCOUNT" && exit 1)
        test -n "$SNOWFLAKE_ROLE" || (echo "Missing SNOWFLAKE_ROLE" && exit 1)
        test -n "$SNOWFLAKE_DATABASE" || (echo "Missing SNOWFLAKE_DATABASE" && exit 1)
        test -n "$SNOWFLAKE_SCHEMA" || (echo "Missing SNOWFLAKE_SCHEMA" && exit 1)
        test -n "$SNOWFLAKE_WAREHOUSE" || (echo "Missing SNOWFLAKE_WAREHOUSE" && exit 1)

    - name: Run DBT model with debug
      run: |
        source dbt-env/bin/activate
        dbt run --select ${{ matrix.model }} --profiles-dir ~/.dbt --debug
